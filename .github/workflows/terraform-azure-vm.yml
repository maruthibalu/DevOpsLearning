name: Terraform Azure VM

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-azure-vm.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-azure-vm.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Terraform operation"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-azure-vm
      cancel-in-progress: false
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP || 'rg-terraform-state' }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT || 'tfstate1304953421' }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER || 'tfstate' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'devops-vm.tfstate' }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_username: ${{ vars.TF_VAR_ADMIN_USERNAME || 'azureuser' }}
      TF_VAR_location: ${{ vars.TF_VAR_LOCATION || 'eastus' }}
      TF_VAR_vm_size: ${{ vars.TF_VAR_VM_SIZE || 'Standard_B1s' }}
      TF_VAR_allowed_ssh_cidr: ${{ vars.TF_VAR_ALLOWED_SSH_CIDR || '0.0.0.0/0' }}
      TF_VAR_prefix: ${{ vars.TF_VAR_PREFIX || 'devops-vm' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select available VM SKU
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation != 'destroy' }}
        shell: bash
        run: |
          set -euo pipefail

          selected_size=""
          candidate_sizes=(
            "$TF_VAR_vm_size"
            "Standard_B1s"
            "Standard_B2s"
            "Standard_D2s_v5"
          )
          declare -A checked_sizes=()

          for sku in "${candidate_sizes[@]}"; do
            if [[ -n "${checked_sizes[$sku]:-}" ]]; then
              continue
            fi
            checked_sizes["$sku"]=1

            available_size=$(az vm list-skus \
              --location "$TF_VAR_location" \
              --size "$sku" \
              --all \
              --query "[?name=='${sku}' && resourceType=='virtualMachines' && length(restrictions)==\`0\`].name | [0]" \
              --output tsv)

            if [[ -n "$available_size" ]]; then
              selected_size="$available_size"
              break
            fi

            echo "VM SKU $sku is unavailable in $TF_VAR_location."
          done

          if [[ -z "$selected_size" ]]; then
            echo "::error::None of the allowed VM SKUs are available in $TF_VAR_location."
            az vm list-skus \
              --location "$TF_VAR_location" \
              --size Standard_D \
              --all \
              --output table
            exit 1
          fi

          echo "Selected VM SKU: $selected_size"
          echo "TF_VAR_vm_size=$selected_size" >> "$GITHUB_ENV"
          {
            echo "### VM SKU selection"
            echo "- Location: \`$TF_VAR_location\`"
            echo "- Selected SKU: \`$selected_size\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate SSH public key
        shell: bash
        run: |
          if [[ -z "${TF_VAR_admin_ssh_public_key//[[:space:]]/}" ]]; then
            echo "::error::Repository secret TF_VAR_ADMIN_SSH_PUBLIC_KEY is missing or empty."
            exit 1
          fi

          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$TF_VAR_admin_ssh_public_key" > "$key_file"

          if ! ssh-keygen -l -f "$key_file" > /dev/null 2>&1; then
            echo "::error::TF_VAR_ADMIN_SSH_PUBLIC_KEY is not a valid OpenSSH public key. Store the complete single-line contents of the .pub file."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Fmt Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Plan
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'plan' }}
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' }}
        run: terraform -chdir=terraform apply -input=false -auto-approve

      - name: Terraform Destroy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy' }}
        run: terraform -chdir=terraform destroy -input=false -auto-approve
